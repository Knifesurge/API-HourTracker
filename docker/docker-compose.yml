services:
  postgres_db:
    image: postgres:16-alpine
    container_name: hourtracker-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - hourtracker-network

  # Backend API config
  backend_api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hourtracker-backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    volumes:
      - ../backend:/app
      - /app/node_modules
    depends_on:
      - postgres_db
    networks:
      - hourtracker-network

  # Frontend config
  frontend_client:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: hourtracker-frontend
    ports:
      - "5173:5173"
    environment:
      - REACT_APP_API_URL=http://localhost:3000/api
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend_api
    networks:
      - hourtracker-network

volumes:
  pg_data:

networks:
  hourtracker-network:
    driver: bridge
